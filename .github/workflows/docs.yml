name: Feature documentation website

on:
  push:
    branches: [main]
    paths:
      - 'js/examples/features/**'
      - 'js/src/**'
      - 'rust/examples/**'
      - 'rust/src/**'
      - 'scripts/**'
      - 'docs/features/**'
      - 'docs/site/**'
      - 'docs/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy generated documentation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pages must be enabled before a GITHUB_TOKEN can deploy. Check the
      # repository setting before installing or building dependencies.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-10-06
        with:
          toolchain: stable

      - name: Install JavaScript dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Verify feature parity and generated files
        run: |
          node scripts/check-parity.mjs
          node scripts/generate-docs.mjs --check

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
