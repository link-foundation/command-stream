name: Bun Shell conformance

# Runs the language-neutral Bun Shell corpus (conformance/bun-shell/) on every
# OS: against Bun.$ itself (the oracle the corpus was recorded from) and
# against command-stream's portable port (js/src/bun-shell/) on Bun,
# Node.js and Deno. The Rust port runs the same corpus from `cargo test` (rust.yml).

on:
  push:
    branches:
      - main
    paths:
      - 'conformance/**'
      - 'js/src/bun-shell/**'
      - 'js/src/bun.mjs'
      - 'js/src/bun.cjs'
      - '.github/workflows/bun-shell.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'conformance/**'
      - 'js/src/bun-shell/**'
      - 'js/src/bun.mjs'
      - 'js/src/bun.cjs'
      - '.github/workflows/bun-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        target: [Bun.$ reference, port on Bun, port on Node.js, port on Deno]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge simulation below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false

      # Run the corpus against the real merge result rather than a possibly
      # stale merge preview. Rationale in .github/scripts/simulate-fresh-merge.sh.
      - name: Simulate a fresh merge with the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/simulate-fresh-merge.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Setup Deno
        if: matrix.target == 'port on Deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run the corpus
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Bun 1.4.2 itself can crash on Windows; trace one case at a time so
          # the log names the case that crashed it.
          ref_args=()
          if [ "$RUNNER_OS" = Windows ]; then ref_args=(--trace --concurrency 1); fi
          # Subprocess tracing (warnings only) for the runners where the port
          # has lost a child's output or hung: Bun on macOS, Deno on Windows
          # (issue #216: three `node -e` cases returned empty stdout after ~3.2s).
          if [ "$RUNNER_OS" = macOS ] || [ "$RUNNER_OS" = Windows ]; then
            export COMMAND_STREAM_TRACE_SUBPROCESS=1
          fi
          case "$TARGET" in
            'Bun.$ reference') bun conformance/bun-shell/run-bun-reference.mjs "${ref_args[@]}" ;;
            'port on Bun')
              if [ "$RUNNER_OS" = macOS ]; then
                bun conformance/bun-shell/run-js.mjs --trace
              else
                bun conformance/bun-shell/run-js.mjs
              fi ;;
            'port on Node.js') node conformance/bun-shell/run-js.mjs ;;
            'port on Deno') deno run -A conformance/bun-shell/run-js.mjs ;;
          esac
