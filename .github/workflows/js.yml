name: JavaScript checks and release

on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      # ESLint runs from the repository root, so it also lints these; without
      # them here a lint error in an experiment or in claude-profiles.mjs first
      # surfaced on an unrelated pull request that happened to touch js/**.
      - 'eslint.config.js'
      - 'claude-profiles.mjs'
      - 'experiments/**'
      - 'scripts/**'
      - 'conformance/**'
      - '.github/scripts/**'
      - '.github/workflows/js.yml'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'js/**'
      # ESLint runs from the repository root, so it also lints these; without
      # them here a lint error in an experiment or in claude-profiles.mjs first
      # surfaced on an unrelated pull request that happened to touch js/**.
      - 'eslint.config.js'
      - 'claude-profiles.mjs'
      - 'experiments/**'
      - 'scripts/**'
      - 'conformance/**'
      - '.github/scripts/**'
      - '.github/workflows/js.yml'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

# Least-privilege default. The jobs that write (release, instant-release,
# changeset-pr) raise their own scopes.
permissions:
  contents: read

# Concurrency is declared per job, not here: a workflow-level cancellable group
# would also cancel a release that has already begun publishing to npm. Read-only
# checks use cancellable `check-*` groups, writers share one repository-wide
# non-cancellable group so a started writer always finishes.

jobs:
  changeset-check:
    name: Check for JavaScript changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changeset-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Check for changesets
        working-directory: js
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun scripts/check-version.mjs
          bun scripts/validate-changeset.mjs

  lint:
    name: Lint and format JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    needs: [changeset-check]
    # `!cancelled()` rather than `always()`: a cancelled changeset-check must not
    # leave this job running.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changeset-check.result == 'success') }}
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge simulation below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false

      # Run the checks below against the real merge result rather than a
      # possibly stale merge preview, and fail on a conflict here rather than at
      # merge time. Rationale in .github/scripts/simulate-fresh-merge.sh.
      - name: Simulate a fresh merge with the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/simulate-fresh-merge.sh

      - name: Check registry publish credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: node .github/scripts/publish-preflight.mjs npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Run ESLint
        working-directory: js
        run: bun run lint

      - name: Check formatting
        working-directory: js
        run: bun run format:check

      - name: Check code duplication
        working-directory: js
        run: bun run check:duplication

      - name: Check TypeScript declarations
        working-directory: js
        run: bun run check:types

      # Runs the exact versioning command the release job runs after a merge,
      # on the same runner image, and discards the result. Without it a change
      # that breaks `changeset version` (issue #216: Changesets 3 spawning a
      # Deno formatter the runner does not have) only fails on main.
      - name: Dry-run release versioning
        working-directory: js
        run: |
          bun run changeset:version
          git status --short
          git checkout -- .

  test:
    # The Node entries differ only by version, so the version has to be part of
    # the name; without it three jobs shared the name "Test JavaScript (node on
    # ubuntu-24.04)" and a required-check rule could not name a single one.
    name: Test JavaScript (${{ matrix.runtime }}${{ matrix.node-version && format(' {0}', matrix.node-version) || '' }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    # The matrix values are part of the group so the entries stay parallel and
    # only a superseded run of the *same* entry is cancelled.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}-${{ matrix.runtime }}-${{ matrix.node-version || 'default' }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        runtime: [bun]
        include:
          - os: ubuntu-24.04
            runtime: node
            node-version: 26
          - os: ubuntu-24.04
            runtime: node
            node-version: 22
          - os: ubuntu-24.04
            runtime: node
            node-version: 24
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge simulation below needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false

      # Run the checks below against the real merge result rather than a
      # possibly stale merge preview, and fail on a conflict here rather than at
      # merge time. Rationale in .github/scripts/simulate-fresh-merge.sh.
      - name: Simulate a fresh merge with the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/simulate-fresh-merge.sh

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js PTY host
        if: matrix.runtime == 'bun'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-15'
        run: brew install jq

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-2025'
        run: choco install jq -y

      # The zx compatibility suite (issue #26) runs a Deno smoke test and a
      # `deno publish --dry-run`; both skip when Deno is missing.
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun'
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        timeout-minutes: 15
        shell: bash
        env:
          COMMAND_STREAM_TRACE: ${{ vars.COMMAND_STREAM_TRACE || 'false' }}
          CI_SCRIPTS_DEBUG: ${{ vars.CI_SCRIPTS_DEBUG || 'false' }}
        run: |
          set -o pipefail
          mkdir -p ci-test-logs
          bun test js/tests/ --timeout 10000 --reporter=junit --reporter-outfile=ci-test-logs/junit.xml 2>&1 | tee ci-test-logs/bun.log

      - name: Preserve Bun test diagnostics
        if: ${{ always() && matrix.runtime == 'bun' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bun-tests-${{ matrix.os }}
          path: ci-test-logs/
          retention-days: 7

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (Node)
        if: matrix.runtime == 'node'
        working-directory: js
        run: npm ci

      - name: Test Node.js compatibility
        if: matrix.runtime == 'node'
        run: |
          node -e "
          import('./js/src/\$.mjs')
            .then(() => console.log('Module loads successfully in Node.js ' + process.version))
            .catch((error) => {
              console.error('Module failed to load:', error.message);
              process.exit(1);
            });
          "
          node -e "
          const commandStream = require('./js/src/\$.cjs');
          if (typeof commandStream !== 'function') {
            console.error('CommonJS entry did not export a callable \$');
            process.exit(1);
          }
          console.log('CommonJS entry loads successfully in Node.js ' + process.version);
          "
          node --test js/tests/node-terminal-artifacts.mjs
          node --test js/tests/node-commonjs-entry.mjs
          node --test js/tests/node-process-regressions.mjs
          node --test js/tests/windows-tree-kill.test.mjs
          node --test js/tests/node-windows-kill.mjs
          node --test js/tests/stdin-epipe.test.mjs
          node --test js/tests/process-runner-signal-exit.test.mjs
          node --test js/tests/github-cli-body.test.mjs
          node --test js/tests/virtual-exit.test.mjs

      # The zx-compatible API (issue #26) ports google/zx's own test suite; the
      # files run one at a time because several upstream cases are timing based.
      - name: Run zx compatibility suite (Node)
        if: matrix.runtime == 'node'
        timeout-minutes: 15
        shell: bash
        run: node --test --test-concurrency=1 js/tests/zx/*.test.mjs

      - name: Run Execa compatibility suite (Node)
        if: matrix.runtime == 'node'
        timeout-minutes: 10
        shell: bash
        run: node --test --test-concurrency=1 js/tests/execa/*.test.mjs js/tests/execa-compat.test.mjs

  process-tree:
    name: Process trees (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-process-tree-${{ matrix.os }}-${{ matrix.node-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Simulate a fresh merge with the base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies for process tests
        # These regressions use the core runner, without building native PTY
        # extensions or the terminal font assets.
        working-directory: js
        run: npm ci --ignore-scripts

      - name: Run descendant termination regressions
        run: node --test js/tests/windows-tree-kill.test.mjs js/tests/node-windows-kill.mjs js/tests/stdin-epipe.test.mjs

  release:
    name: Release JavaScript package
    needs: [lint, test, process-tree]
    # Required because lint/test depend on the pull-request-only changeset-check
    # job, which is skipped on push events.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.process-tree.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Shared by every job in this repository that pushes to main or publishes.
    # `cancel-in-progress: false` lets a started release finish; the next writer
    # waits instead of interrupting a half-published version.
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      # This job pushes to main and creates the release, so it needs the
      # credential actions/checkout persists in .git/config. Everything else in
      # this repository sets persist-credentials: false; zizmor runs at
      # --min-confidence low so a checkout that forgets it fails the audit, and
      # the six writer jobs that legitimately need it say so here.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing
        working-directory: js
        run: bun scripts/setup-npm.mjs

      - name: Check for changesets
        id: check_changesets
        working-directory: js
        run: |
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "Found $CHANGESET_COUNT JavaScript changeset file(s)"
          echo "has_changesets=$([[ $CHANGESET_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "changeset_count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Check if release is needed
        id: check_release
        working-directory: js
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
        run: bun scripts/check-release-needed.mjs

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && fromJSON(steps.check_changesets.outputs.changeset_count) > 1
        working-directory: js
        run: bun scripts/merge-changesets.mjs

      - name: Version package and commit to main
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        working-directory: js
        run: bun scripts/version-and-commit.mjs --mode changeset

      - name: Publish to npm
        # Run if a changeset bumped+committed the version, if a previous attempt
        # already committed it (re-run safety), or if check-release-needed found
        # the current package.json version is not on npm. `current_unpublished`
        # is the authoritative self-heal trigger: it fires whether or not a
        # changeset is present, so it also covers the #166 "failed to do any
        # deploy" restart, where a changeset existed locally but the bump had
        # already been consumed on origin/main, leaving v0.10.2 stranded.
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          steps.check_release.outputs.current_unpublished == 'true'
        id: publish
        working-directory: js
        run: bun scripts/publish-to-npm.mjs --should-pull

      - name: Create JavaScript GitHub Release
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: bun scripts/create-github-release.mjs --release-version "$PUBLISHED_VERSION" --repository "$REPOSITORY" --tag-prefix js-v

      - name: Format JavaScript GitHub release notes
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/format-github-release.mjs --release-version "$PUBLISHED_VERSION" --repository "$REPOSITORY" --commit-sha "$COMMIT_SHA" --tag-prefix js-v

      - name: Verify npm availability
        # Guards against the #166 false positive: a release/tag must correspond
        # to a version that is actually installable from npm.
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
        run: bun scripts/wait-for-npm.mjs --release-version "$PUBLISHED_VERSION"

  instant-release:
    name: Instant JavaScript release
    needs: [lint, test, process-tree]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      needs.process-tree.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      # This job pushes to main and creates the release, so it needs the
      # credential actions/checkout persists in .git/config. Everything else in
      # this repository sets persist-credentials: false; zizmor runs at
      # --min-confidence low so a checkout that forgets it fails the audit, and
      # the six writer jobs that legitimately need it say so here.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing
        working-directory: js
        run: bun scripts/setup-npm.mjs

      - name: Version package and commit to main
        id: version
        working-directory: js
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: bun scripts/version-and-commit.mjs --mode instant --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Publish to npm
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish
        working-directory: js
        run: bun scripts/publish-to-npm.mjs

      - name: Create JavaScript GitHub Release
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
        run: bun scripts/create-github-release.mjs --release-version "$PUBLISHED_VERSION" --repository "$REPOSITORY" --tag-prefix js-v

      - name: Format JavaScript GitHub release notes
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/format-github-release.mjs --release-version "$PUBLISHED_VERSION" --repository "$REPOSITORY" --commit-sha "$COMMIT_SHA" --tag-prefix js-v

      - name: Verify npm availability
        # Guards against the #166 false positive: a release/tag must correspond
        # to a version that is actually installable from npm.
        if: steps.publish.outputs.published == 'true'
        working-directory: js
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
        run: bun scripts/wait-for-npm.mjs --release-version "$PUBLISHED_VERSION"

  changeset-pr:
    name: Create JavaScript changeset PR
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      # This job pushes to main and creates the release, so it needs the
      # credential actions/checkout persists in .git/config. Everything else in
      # this repository sets persist-credentials: false; zizmor runs at
      # --min-confidence low so a checkout that forgets it fails the audit, and
      # the six writer jobs that legitimately need it say so here.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: js
        run: bun install --frozen-lockfile

      - name: Create changeset file
        working-directory: js
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: bun scripts/create-manual-changeset.mjs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Format changeset with Prettier
        working-directory: js
        run: bunx prettier --write ".changeset/*.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual JavaScript ${{ github.event.inputs.bump_type }} release'
          branch: changeset-js-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual JavaScript ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual JavaScript Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** npm release.

            ### Release Details
            - Type: ${{ github.event.inputs.bump_type }}
            - Description: ${{ github.event.inputs.description || 'Manual JavaScript release' }}
            - Triggered by: @${{ github.actor }}
