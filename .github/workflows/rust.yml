name: Rust checks and release

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default. The jobs that write (release, instant-release,
# changelog-pr) raise their own scopes.
permissions:
  contents: read

# Concurrency is declared per job, not here: a workflow-level cancellable group
# would also cancel a release that has already begun publishing to crates.io.
# Read-only checks use cancellable `check-*` groups, writers share one
# repository-wide non-cancellable group so a started writer always finishes.

env:
  CARGO_TERM_COLOR: always
  # Warnings must fail the build. Without this, `cargo clippy` reports problems
  # and still exits 0, so every Rust check was a false negative (issue #199).
  # Registry dependencies are compiled with `--cap-lints allow`, so this only
  # denies warnings in this crate's own code.
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  # The crates.io credentials are deliberately *not* here: a workflow-level env
  # hands them to every job, including the ones that only run `cargo test` on
  # a pull request. They are declared on the two publishing jobs instead.

jobs:
  changelog:
    name: Rust changelog fragment check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Install rust-script
        run: cargo install rust-script

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script rust/scripts/check-changelog-fragment.rs

  lint:
    name: Lint and format Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changelog]
    # `!cancelled()` rather than `always()`: a cancelled changelog check must not
    # leave this job running.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success') }}
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        # Explicit despite the workflow-level RUSTFLAGS: clippy's own lints are
        # not covered by RUSTFLAGS, only rustc's.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        working-directory: rust
        # rustdoc-only lints (broken intra-doc links, unclosed HTML tags) are
        # reported by neither clippy nor `cargo test --doc`, so they need their
        # own gate. RUSTDOCFLAGS=-Dwarnings comes from the workflow env.
        run: cargo doc --no-deps --all-features

  test:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [changelog]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success') }}
    # The matrix value is part of the group so the per-OS entries stay parallel
    # and only a superseded run of the *same* entry is cancelled.
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: rust
        run: cargo test --all-features --verbose

      - name: Run doc tests
        working-directory: rust
        run: cargo test --doc --all-features --verbose

  scripts:
    name: Test Rust release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changelog]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success') }}
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-scripts
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-scripts-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scripts-

      - name: Install rust-script
        run: cargo install rust-script

      - name: Run release script unit tests
        # Run the inline `#[cfg(test)]` suites for every rust-script under
        # rust/scripts/. `cargo test` only covers the library crate, so without
        # this step the release-script regression tests (e.g. the rebase
        # ordering guard) never execute in CI.
        run: |
          set -euo pipefail
          status=0
          for f in rust/scripts/*.rs; do
            if grep -q 'cfg(test)' "$f"; then
              echo "::group::rust-script --test $f"
              rust-script --test "$f" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  build:
    name: Build Rust package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        working-directory: rust
        run: cargo build --release --verbose

      - name: Check package
        working-directory: rust
        run: cargo package --allow-dirty

  release:
    name: Release Rust crate
    needs: [lint, test, scripts, build]
    # Required because lint/test depend on the pull-request-only changelog job,
    # which is skipped on push events.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.scripts.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Shared by every job in this repository that pushes to main or publishes.
    # `cancel-in-progress: false` lets a started release finish; the next writer
    # waits instead of interrupting a half-published version.
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Install rust-script
        run: cargo install rust-script

      - name: Determine bump type
        id: bump
        run: rust-script rust/scripts/get-bump-type.rs

      - name: Check whether Rust release is needed
        id: release_needed
        env:
          HAS_FRAGMENTS: ${{ steps.bump.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: rust-script rust/scripts/check-release-needed.rs --tag-prefix rust-v

      - name: Version Rust crate and commit to main
        if: steps.release_needed.outputs.should_release == 'true'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.bump_type }}
        run: rust-script rust/scripts/version-and-commit.rs --bump-type "$BUMP_TYPE" --tag-prefix rust-v --release-label Rust

      - name: Read Rust release version
        if: steps.release_needed.outputs.should_release == 'true'
        id: current_version
        run: rust-script rust/scripts/get-version.rs

      - name: Publish to crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.release_needed.outputs.skip_bump == 'true'
        id: publish_crate
        run: rust-script rust/scripts/publish-crate.rs

      - name: Create Rust GitHub Release
        if: steps.publish_crate.outputs.publish_result == 'success' || steps.publish_crate.outputs.publish_result == 'already_exists'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version || steps.current_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: rust-script rust/scripts/create-github-release.rs --release-version "$RELEASE_VERSION" --repository "$REPOSITORY" --tag-prefix rust-v --language Rust --release-label Rust

      - name: Wait for crate availability
        if: steps.publish_crate.outputs.publish_result == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version || steps.current_version.outputs.version }}
        run: rust-script rust/scripts/wait-for-crate.rs --version "$RELEASE_VERSION"

  instant-release:
    name: Instant Rust release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Install rust-script
        run: cargo install rust-script

      - name: Version Rust crate and commit to main
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script rust/scripts/version-and-commit.rs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION" --tag-prefix rust-v --release-label Rust

      - name: Publish to crates.io
        if: steps.version.outputs.version_committed == 'true'
        id: publish_crate
        run: rust-script rust/scripts/publish-crate.rs

      - name: Create Rust GitHub Release
        if: steps.publish_crate.outputs.publish_result == 'success' || steps.publish_crate.outputs.publish_result == 'already_exists'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
          REPOSITORY: ${{ github.repository }}
        run: rust-script rust/scripts/create-github-release.rs --release-version "$RELEASE_VERSION" --repository "$REPOSITORY" --tag-prefix rust-v --language Rust --release-label Rust

      - name: Wait for crate availability
        if: steps.publish_crate.outputs.publish_result == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: rust-script rust/scripts/wait-for-crate.rs --version "$RELEASE_VERSION"

  changelog-pr:
    name: Create Rust changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - name: Install rust-script
        run: cargo install rust-script

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script rust/scripts/create-changelog-fragment.rs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog fragment for manual Rust ${{ github.event.inputs.bump_type }} release'
          branch: changelog-rust-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual Rust ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Rust Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** crates.io release.

            ### Release Details
            - Type: ${{ github.event.inputs.bump_type }}
            - Description: ${{ github.event.inputs.description || 'Manual Rust release' }}
            - Triggered by: @${{ github.actor }}
