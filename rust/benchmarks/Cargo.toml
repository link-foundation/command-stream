[package]
name = "command-stream-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "command-stream-benchmarks"

[dependencies]
async-process = "=2.5.0"
chrono = "=0.4.42"
command-stream = { path = ".." }
duct = "=1.1.2"
futures = "=0.3.34"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"
subprocess = "=1.2.1"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["full", "process"] }
xshell = "=0.2.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
