            "id": "options",
            "title": "Options: capture, cwd, env, stdin",

            "alternatives": {

            "source": "// $({ ... }) configures capture, mirroring, cwd, env and stdin.\nimport { $ } from '../../src/$.mjs';\nimport { example, makeTempDir } from './_harness.mjs';\nimport path from 'path';\nimport fs from 'fs';\n\nawait example(\n  { id: 'options', title: 'Options: capture, cwd, env, stdin' },\n  async ({ record }) => {\n    const dir = makeTempDir('options');\n    fs.writeFileSync(path.join(dir, 'marker.txt'), 'here\\n');\n\n    record(\n      'captured output',\n      (await $({ mirror: false, capture: true })`echo captured`).stdout\n    );\n    record(\n      'capture disabled',\n      (await $({ mirror: false, capture: false })`echo dropped`).stdout\n    );\n\n    const inDir = await $({ mirror: false, cwd: dir })`ls`;\n    record('cwd option', inDir.stdout);\n\n    const withEnv = await $({\n      mirror: false,\n      env: { ...process.env, DEMO_VALUE: 'from-env' },\n    })`printenv DEMO_VALUE`;\n    record('env option', withEnv.stdout);\n\n    const withStdin = await $({ mirror: false, stdin: 'piped in\\n' })`cat`;\n    record('stdin option', withStdin.stdout);\n  }\n);",

            "source": "// Besides the template tag there are plain functions: sh, exec, run and create.\nimport { $, sh, exec, run, create } from '../../src/$.mjs';\nimport { example } from './_harness.mjs';\n\nawait example(\n  { id: 'function-api', title: 'sh(), exec(), run() and create()' },\n  async ({ record }) => {\n    record('sh(command)', (await sh('echo from-sh', { mirror: false })).stdout);\n    record(\n      'exec(file, args)',\n      (await exec('echo', ['from-exec'], { mirror: false })).stdout\n    );\n    record('run(command)', (await run('echo from-run')).stdout);\n\n    // create() returns a $ with preset options.\n    const $quiet = create({ mirror: false, capture: true });\n    record('create(options)', (await $quiet`echo from-create`).stdout);\n\n    // $ itself can be called with options for the same effect.\n    record('$(options)', (await $({ mirror: false })`echo from-dollar`).stdout);\n  }\n);",

          {
            "id": "cancellation",
            "title": "Killing and cancelling commands",
            "category": "Running commands",
            "summary": "A running command can be killed, and cancelling one leaves the rest of the script running.",
            "file": "js/examples/features/cancellation.mjs",
            "api": ["$", "ProcessRunner#kill", "forceCleanupAll"],
            "alternatives": {
              "bun-shell": {
                "unsupported": "a ShellPromise has no kill method; the command runs to completion"
              },
              "zx": "const p = $({ nothrow: true })`sleep 5`; p.kill();",
              "execa": "const p = execa({ reject: false })`sleep 5`; p.kill();",
              "shelljs": "const child = shell.exec('sleep 5', { async: true }); child.kill();",
              "child_process": "const child = spawn('sleep', ['5']); child.kill();"
            },
            "source": "// Running commands can be killed, and virtual commands are told about it\n// through abortSignal / isCancelled().\nimport { $, register, unregister } from '../../src/$.mjs';\nimport { example } from './_harness.mjs';\n\nconst $q = $({ mirror: false });\n\nawait example(\n  { id: 'cancellation', title: 'Killing and cancelling commands' },\n  async ({ record }) => {\n    const runner = $q`sleep 30`;\n    runner.start();\n    setTimeout(() => runner.kill(), 100);\n    const killed = await runner;\n    record('exit code after kill()', killed.code);\n\n    // The handler reports back as soon as it notices the cancellation, so the\n    // example does not depend on timing.\n    let noticed;\n    const noticedCancellation = new Promise((resolve) => {\n      noticed = resolve;\n    });\n\n    register('cancellable', async ({ abortSignal, isCancelled }) => {\n      for (let i = 0; i \u003c 200; i++) {\n        if (abortSignal?.aborted || isCancelled()) {\n          noticed({\n            aborted: abortSignal?.aborted === true,\n            cancelled: isCancelled(),\n          });\n          break;\n        }\n        await new Promise((resolve) => setTimeout(resolve, 5));\n      }\n      return { stdout: '', code: 0 };\n    });\n\n    const virtualRunner = $q`cancellable`;\n    virtualRunner.start();\n    setTimeout(() => virtualRunner.kill(), 50);\n    await virtualRunner;\n    record('what the virtual command observed', await noticedCancellation);\n    unregister('cancellable');\n  }\n);",
            "rustApi": ["ProcessRunner::kill", "OutputStream::kill"],
            "rustSource": "async fn cancellation() -> ExampleResult {\n    let mut stream = StreamingRunner::new(\"sleep 30\").stream();\n    let started = stream.wait_for_pid().await.is_some();\n    stream.kill();\n    let mut exit_code = 0;\n    while let Some(chunk) = stream.next().await {\n        if let OutputChunk::Exit(code) = chunk {\n            exit_code = code;\n        }\n    }\n    Ok(vec![\n        observation(\"process started\", started),\n        observation(\"cancelled exit is non-zero\", exit_code != 0),\n    ])\n}",

            "source": "// A command is an async iterable of output chunks, so output can be processed\n// while the command is still running.\nimport { $ } from '../../src/$.mjs';\nimport { example } from './_harness.mjs';\n\nconst $q = $({ mirror: false });\n\nawait example(\n  { id: 'async-iteration', title: 'Async iteration over output' },\n  async ({ record }) => {\n    const lines = [];\n    for await (const chunk of $q`seq 1 5`.stream()) {\n      if (chunk.type === 'exit') {\n        continue;\n      }\n      lines.push({ type: chunk.type, data: chunk.data.toString() });\n    }\n    record('chunk types', [...new Set(lines.map((l) => l.type))]);\n    record('collected output', lines.map((l) => l.data).join(''));\n\n    // stdout and stderr are tagged, so both can be consumed from one loop.\n    const tagged = [];\n    for await (const chunk of $q`sh -c 'echo to-stdout; echo to-stderr >&2'`.stream()) {\n      if (chunk.type === 'exit') {\n        continue;\n      }\n      tagged.push([chunk.type, chunk.data.toString().trim()]);\n    }\n    record('tagged chunks', tagged.sort());\n\n    // Leaving the loop early terminates the command.\n    let seen = 0;\n    for await (const _chunk of $q`seq 1 1000`.stream()) {\n      seen++;\n      break;\n    }\n    record('iteration can stop early', seen === 1);\n  }\n);",

            "source": "// Commands are EventEmitters: 'stdout', 'stderr', 'data' and 'end'.\nimport { $ } from '../../src/$.mjs';\nimport { example } from './_harness.mjs';\n\nconst $q = $({ mirror: false });\n\nawait example(\n  { id: 'events', title: 'EventEmitter interface' },\n  async ({ record }) => {\n    const events = [];\n\n    await new Promise((resolve, reject) => {\n      $q`sh -c 'echo out; echo err >&2'`\n        .on('stdout', (data) => events.push(['stdout', data.toString().trim()]))\n        .on('stderr', (data) => events.push(['stderr', data.toString().trim()]))\n        .on('end', (result) => {\n          events.push(['end', result.code]);\n          resolve();\n        })\n        .on('error', reject)\n        .start();\n    });\n\n    record(\n      'events (sorted: stdout/stderr order is up to the OS)',\n      events.sort()\n    );\n\n    // The 'data' event receives both streams with a type tag.\n    const tagged = [];\n    await new Promise((resolve) => {\n      $q`echo tagged`\n        .on('data', (chunk) =>\n          tagged.push([chunk.type, chunk.data.toString().trim()])\n        )\n        .on('end', () => resolve())\n        .start();\n    });\n    record('data events', tagged);\n  }\n);",

            "rustSource": "async fn events() -> ExampleResult {\n    let emitter = StreamEmitter::new();\n    let count = Arc::new(AtomicUsize::new(0));\n    let listener_count = Arc::clone(&count);\n    emitter\n        .on(EventType::Stdout, move |_| {\n            listener_count.fetch_add(1, Ordering::SeqCst);\n        })\n        .await;\n    emitter\n        .emit(EventType::Stdout, EventData::String(\"hello\".to_string()))\n        .await;\n    Ok(vec![observation(\n        \"stdout events\",\n        count.load(Ordering::SeqCst),\n    )])\n}",

    <script>
      const data = JSON.parse(document.getElementById('data').textContent);
      const others = data.libraries.filter(
        (library) => library.id !== 'command-stream'
      );
      const byId = new Map(
        data.features.map((feature) => [feature.id, feature])
      );

      const escape = (text) =>
        String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

      function renderNav(query) {
        const needle = query.trim().toLowerCase();
        const html = data.categories
          .map((category) => {
            const matches = data.features.filter(
              (feature) =>
                feature.category === category &&
                (needle === '' ||
                  (
                    feature.title +
                    ' ' +
                    feature.summary +
                    ' ' +
                    feature.api.join(' ')
                  )
                    .toLowerCase()
                    .includes(needle))
            );
            if (matches.length === 0) return '';
            return (
              '<h2>' +
              escape(category) +
              '</h2>' +
              matches
                .map(
                  (feature) =>
                    '<a href="#' +
                    feature.id +
                    '">' +
                    escape(feature.title) +
                    '</a>'
                )
                .join('')
            );
          })
          .join('');
        document.getElementById('nav-links').innerHTML = html;
        markActive();
      }

      function markActive() {
        const current = location.hash.slice(1);
        for (const link of document.querySelectorAll('nav a')) {
          link.classList.toggle(
            'active',
            link.getAttribute('href') === '#' + current
          );
        }
      }

      function overview() {
        const runtimeHeader =
          data.runtimes
            .map(
              (runtime) => '<th>JavaScript (' + escape(runtime.label) + ')</th>'
            )
            .join('') + '<th>Rust</th>';
        const runtimeRows = data.features
          .map(
            (feature) =>
              '<tr><td><a href="#' +
              feature.id +
              '">' +
              escape(feature.title) +
              '</a></td>' +
              data.runtimes.map(() => '<td>&#10003;</td>').join('') +
              '<td>&#10003;</td></tr>'
          )
          .join('');

        const libraryHeader = others
          .map((library) => '<th>' + escape(library.name) + '</th>')
          .join('');
        const libraryRows = data.features
          .map(
            (feature) =>
              '<tr><td><a href="#' +
              feature.id +
              '">' +
              escape(feature.title) +
              '</a></td><td>&#10003;</td>' +
              others
                .map((library) => {
                  const alternative = feature.alternatives[library.id];
                  const supported = typeof alternative === 'string';
                  return (
                    '<td>' + (supported ? '&#10003;' : '&mdash;') + '</td>'
                  );
                })
                .join('') +
              '</tr>'
          )
          .join('');

        return (
          '<h2>Language and runtime parity</h2>' +
          '<p>Every feature below has an executable JavaScript and Rust example. JavaScript output is also compared across Node and Bun.</p>' +
          '<table><thead><tr><th>Feature</th>' +
          runtimeHeader +
          '</tr></thead><tbody>' +
          runtimeRows +
          '</tbody></table>' +
          '<h2>Library comparison</h2>' +
          '<table><thead><tr><th>Feature</th><th>command-stream</th>' +
          libraryHeader +
          '</tr></thead><tbody>' +
          libraryRows +
          '</tbody></table>'
        );
      }

      function featureView(feature) {
        const output = feature.identicalOutput
          ? '<p>Identical in ' +
            data.runtimes
              .map((runtime) => escape(runtime.label))
              .join(' and ') +
            ':</p><pre><code>' +
            escape(feature.output[data.runtimes[0].id]) +
            '</code></pre>'
          : data.runtimes
              .map(
                (runtime) =>
                  '<h4>' +
                  escape(runtime.label) +
                  '</h4><pre><code>' +
                  escape(feature.output[runtime.id]) +
                  '</code></pre>'
              )
              .join('');

        const comparison = others
          .map((library) => {
            const alternative = feature.alternatives[library.id];
            const body =
              typeof alternative === 'string'
                ? '<pre><code>' + escape(alternative) + '</code></pre>'
                : '<p class="unsupported">Not supported &mdash; ' +
                  escape(alternative.unsupported) +
                  '.</p>';
            return (
              '<h4><a href="' +
              library.url +
              '">' +
              escape(library.name) +
              '</a></h4>' +
              body
            );
          })
          .join('');

        return (
          '<h2>' +
          escape(feature.title) +
          '</h2>' +
          '<p>' +
          escape(feature.summary) +
          '</p>' +
          '<p><span class="badge">' +
          escape(feature.category) +
          '</span> ' +
          '</p><h3>JavaScript</h3><p>' +
          feature.api
            .map(
              (name) =>
                '<span class="badge"><code>' + escape(name) + '</code></span>'
            )
            .join(' ') +
          '</p>' +
          '<h4>Example</h4><pre><code>' +
          escape(feature.source) +
          '</code></pre>' +
          '<h4>Output</h4>' +
          output +
          '<h3>Rust</h3><p>' +
          feature.rustApi
            .map(
              (name) =>
                '<span class="badge"><code>' + escape(name) + '</code></span>'
            )
            .join(' ') +
          '</p>' +
          '<h4>Example</h4><pre><code>' +
          escape(feature.rustSource) +
          '</code></pre>' +
          '<h4>Output</h4><pre><code>' +
          escape(feature.rustOutput) +
          '</code></pre>' +
          '<h3>The same thing in other libraries</h3>' +
          comparison
        );
      }

      function render() {
        const id = location.hash.slice(1);
        const feature = byId.get(id);
        document.getElementById('content').innerHTML = feature
          ? featureView(feature)
          : overview();
        markActive();
        window.scrollTo(0, 0);
      }

      document
        .getElementById('filter')
        .addEventListener('input', (event) => renderNav(event.target.value));
      window.addEventListener('hashchange', render);
      renderNav('');
      render();
    </script>
  </body>
</html>
